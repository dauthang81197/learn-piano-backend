name: Deploy Backend to VPS

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

env:
  DOCKER_IMAGE: learn-piano-backend
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------- LINT CHECK --------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint:ci

      # -------- BUILD IMAGE --------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (Optional)
        if: ${{ env.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE:latest .
          docker save $DOCKER_IMAGE:latest | gzip > image.tar.gz

      # -------- DEPLOY (CHỈ KHI PUSH) --------
      - name: Prepare SSH key
        if: ${{ github.event_name == 'push' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to VPS
        if: ${{ github.event_name == 'push' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "image.tar.gz,docker-compose.prod.yml"
          target: "/home/${{ env.VPS_USER }}/learn-piano-backend"

      - name: Deploy on VPS
        if: ${{ github.event_name == 'push' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/${{ env.VPS_USER }}/learn-piano-backend

            # Load Docker image
            docker load < image.tar.gz
            rm image.tar.gz

            # Write .env from GitHub Secrets
            cat > .env <<EOF
            PORT=${{ secrets.PORT }}
            NODE_ENV=production
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            STRIPE_PREMIUM_PRICE_ID=${{ secrets.STRIPE_PREMIUM_PRICE_ID }}
            FRONTEND_URLS=${{ secrets.FRONTEND_URLS }}
            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
            R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}
            EOF

            # Deploy
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

            # Show status
            docker compose -f docker-compose.prod.yml ps

      - name: Verify deployment
        if: ${{ github.event_name == 'push' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Wait for container to be ready
            sleep 15

            # Check if container is running
            cd /home/${{ env.VPS_USER }}/learn-piano-backend
            if docker compose -f docker-compose.prod.yml ps | grep -q "Up"; then
              echo "Deployment successful!"
              echo "Container status:"
              docker compose -f docker-compose.prod.yml ps
              echo ""
              echo "Recent logs:"
              docker compose -f docker-compose.prod.yml logs --tail=50
            else
              echo "Deployment failed!"
              echo "Container status:"
              docker compose -f docker-compose.prod.yml ps
              echo ""
              echo "Error logs:"
              docker compose -f docker-compose.prod.yml logs --tail=100
              exit 1
            fi

